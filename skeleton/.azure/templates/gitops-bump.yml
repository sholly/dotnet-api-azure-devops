# Writes the image tag this run built into one GitOps values file and pushes it.
# Argo CD takes it from there.
#
# This file is copied verbatim by the scaffolder (it is listed in the template's
# `copyWithoutTemplating`), so the `${{ }}` below is Azure Pipelines template
# syntax and not Nunjucks. Don't add scaffolder `${{ values.* }}` references here —
# pass them in as parameters from azure-pipelines.yml instead.

parameters:
  - name: valuesFile
    displayName: Values file to rewrite, relative to the GitOps repo root
    type: string
  - name: environment
    displayName: Environment name, used in the commit message
    type: string
  - name: branch
    displayName: Branch of the GitOps repo to push to
    type: string
  - name: workingDirectory
    type: string
    default: $(gitopsDir)

steps:
  - bash: |
      set -euo pipefail

      FILE='${{ parameters.valuesFile }}'
      BRANCH='${{ parameters.branch }}'
      ENVIRONMENT='${{ parameters.environment }}'
      NEW_TAG='$(tag)'
      # Hoisted so no Azure Pipelines $(macro) ends up nested inside a bash $( ... ).
      APP_REPO='$(Build.Repository.Name)'
      BUILD_NUMBER='$(Build.BuildNumber)'
      SOURCE_VERSION='$(Build.SourceVersion)'
      SHORT_SHA="${SOURCE_VERSION:0:8}"

      git config user.email 'noreply@dev.azure.com'
      git config user.name 'Azure Pipelines'

      # Retry on push rejection: two builds of the same branch can race to bump the
      # same file. Each attempt resets onto the remote tip and re-applies the edit,
      # so there is nothing to rebase or merge.
      attempt=1
      while [ "$attempt" -le 5 ]; do
        git fetch --quiet origin "$BRANCH"
        git checkout --quiet -B pipeline-bump "origin/$BRANCH"

        matches="$(grep -cE '^[[:space:]]*tag:' "$FILE" || true)"
        if [ "$matches" -ne 1 ]; then
          echo "##vso[task.logissue type=error]$FILE must contain exactly one 'tag:' key, found $matches. Refusing to guess which one to rewrite."
          exit 1
        fi

        # Write-and-move rather than `sed -i`, whose argument handling differs
        # between GNU and BSD sed.
        sed -E "s|^([[:space:]]*tag:).*|\1 \"$NEW_TAG\"|" "$FILE" > "$FILE.tmp"
        mv "$FILE.tmp" "$FILE"

        if git diff --quiet -- "$FILE"; then
          echo "$FILE already pins $NEW_TAG — nothing to push."
          exit 0
        fi

        git add "$FILE"
        git commit --quiet -m "$ENVIRONMENT: $APP_REPO -> $NEW_TAG" \
          -m "Build $BUILD_NUMBER from $SHORT_SHA"

        if git push --quiet origin "HEAD:refs/heads/$BRANCH"; then
          echo "Pushed $FILE -> $NEW_TAG"
          git --no-pager show --stat --oneline HEAD
          exit 0
        fi

        echo "Push rejected (attempt $attempt of 5) — someone else pushed first. Retrying."
        attempt=$((attempt + 1))
        sleep $((attempt * 3))
      done

      echo "##vso[task.logissue type=error]Could not push $FILE after 5 attempts."
      exit 1
    workingDirectory: ${{ parameters.workingDirectory }}
    displayName: Pin ${{ parameters.environment }} image tag
