# Dev overrides for ${{ values.name }}. Applied on top of values.yaml.
#
# Argo CD application: ${{ values.name }}-dev   ->   namespace ${{ values.devNamespace }}
# The "tag:" line below is rewritten by the "Deploy to dev" stage of
# azure-pipelines.yml on every build of ${{ values.defaultBranch }}. Nothing else in this
# file should contain a "tag:" key.

replicaCount: 1

aspnetcoreEnvironment: Development

image:
  tag: "latest"

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
